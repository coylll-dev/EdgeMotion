name: Build EdgeMotion
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v3
      - name: Build solution
        shell: cmd
        run: msbuild EdgeMotion.sln /m /p:Configuration=Release /p:Platform="Any CPU"
      - name: Run gesture tests
        shell: cmd
        run: tests\bin\Release\EdgeMotion.Tests.exe
      - uses: actions/upload-artifact@v6
        with:
          name: EdgeMotion-windows
          path: |
            bin/Release/EdgeMotion.exe
            bin/Release/EdgeMotion.exe.config
          if-no-files-found: error
