name: Build EdgeMotion
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and test
        shell: powershell
        run: ./build.ps1 -Test
      - name: Package portable app
        shell: pwsh
        run: Compress-Archive -Path artifacts/EdgeMotion.exe,artifacts/EdgeMotion.exe.config -DestinationPath artifacts/EdgeMotion-windows.zip
      - uses: actions/upload-artifact@v6
        with:
          name: EdgeMotion-windows
          path: artifacts/EdgeMotion-windows.zip
